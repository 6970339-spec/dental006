<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dental CRM — мобильная версия</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: auto; background: radial-gradient(circle at 25% 15%, #264f73, #102f50 48%, #0a2239); color: white; font-family: Inter, "Segoe UI", sans-serif; }
    main { display: grid; grid-template-columns: 300px auto; align-items: center; gap: 70px; padding: 40px; }
    .copy small { color: #57c8b5; font-size: 11px; font-weight: 750; letter-spacing: 1.6px; text-transform: uppercase; }
    .copy h1 { margin: 14px 0 16px; font-size: 34px; line-height: 1.12; letter-spacing: -1.2px; }
    .copy p { color: rgba(255,255,255,.62); font-size: 13px; line-height: 1.65; }
    .copy span { display: inline-flex; align-items: center; margin-top: 12px; padding: 8px 11px; border-radius: 9px; background: rgba(62,180,161,.16); color: #84d7ca; font-size: 10px; }
    .phone { width: 414px; padding: 12px; border-radius: 48px; background: #111a22; box-shadow: 0 35px 90px rgba(0,0,0,.45), inset 0 0 0 2px #34414d; position: relative; }
    .phone::before { content: ""; position: absolute; top: 20px; left: 50%; translate: -50% 0; width: 104px; height: 25px; border-radius: 16px; background: #111a22; z-index: 2; }
    iframe { display: block; width: 390px; height: min(844px, calc(100vh - 80px)); min-height: 620px; border: 0; border-radius: 37px; background: #f4f6f7; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; gap: 25px; padding: 24px 12px; } .copy { text-align: center; max-width: 390px; } .copy h1 { font-size: 26px; } .phone { width: min(414px, calc(100vw - 24px)); } iframe { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <small>Dental CRM · PWA</small>
      <h1>Мобильная версия</h1>
      <p>Интерактивное представление приложения на экране телефона. Можно открывать пациентов, календарь, лечение и финансы.</p>
      <span>● Адаптивный интерфейс активен</span>
    </section>
    <div class="phone"><iframe src="/" title="Dental CRM на телефоне"></iframe></div>
  </main>
</body>
</html>
